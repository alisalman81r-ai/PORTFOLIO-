<!doctype html>
<html lang="en" class="scroll-smooth" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Set the theme before first paint so the page never flashes the wrong
      background. Kept inline and synchronous on purpose: this must run before
      the browser paints, so it cannot be deferred into the React bundle.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored || (prefersDark ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (_) {
          /* private mode / storage disabled — fall back to the markup default */
        }
      })()
    </script>

    <!-- Title, description, OG, Twitter, canonical and JSON-LD are injected at
         build time from src/data/seo.js — see seoPlugin in vite.config.js.
         This fallback title only appears in dev. -->
    <title>Portfolio</title>
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0b" />
  </head>

  <body>
    <div id="root"></div>

    <noscript>
      This site requires JavaScript to run.
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
