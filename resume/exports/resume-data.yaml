      overview: "[One or two sentences: what it is, who it is for, and what it does that matters.]"
      problem: "[What was wrong, missing, or hard before this existed.]"
      solution: "[What you built, and why you built it that way.]"
      technologies:
        - "[Tech]"
        - "[Tech]"
        - "[Tech]"
      features:
        - "[A capability, and why it matters to the user]"
        - "[Another — three or four is enough]"
      challenges:
