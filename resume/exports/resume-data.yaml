      id: "construction-website"
      name: "Construction Website"
      category: "Marketing Site"
      year: "2025"
      status: "Live"
      role: "Design & Frontend Development"
      duration: "6 weeks"
      featured: true
      overview: "A client-facing marketing site for a construction firm, with a content structure the team can maintain without a developer."
      problem: "The existing site was a brochure that could not be updated, so the project portfolio was years out of date — the single thing a prospective client most wants to see."
      solution: "A component-driven build with a clear content model, so new projects and services slot into existing layouts. Type and spacing scale with the viewport, keeping the site solid on the phones most of its traffic arrives on."
      technologies:
        - "React"
        - "Next.js"
        - "Tailwind CSS"
        - "Vercel"
      features:
