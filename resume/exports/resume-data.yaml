skills:
  _noteSpelling: "US spelling throughout — 'Color Theory', 'Performance Optimization'. ATS keyword matching is literal, and the great majority of remote and international tech postings are written in US English, so a British-spelled term scores zero against them. The portfolio prose stays British; this file does not. Reverse it here if you are targeting UK and EU employers only."
  _note: "Grouped exactly as src/data/skills.js groups them, with Tools split into Version Control and Deployment because recruiters and ATS parsers scan for those terms specifically. `Currently learning` is listed separately and honestly — claiming TypeScript as a strength when it is in progress is the fastest way to lose a technical screen."
  Frontend:
    - "HTML5"
    - "CSS3"
    - "JavaScript (ES6+)"
    - "React"
    - "Next.js"
    - "Tailwind CSS"
    - "Responsive Design"
    - "Web Accessibility (WCAG 2.1 AA)"
