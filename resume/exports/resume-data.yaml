
_readme:
  - "CANONICAL RESUME CONTENT. Every generated file is built from this one."
  - ""
  - "Edit this file, then run `npm run resume`. Do not edit the generated .md,"
  - ".html or .pdf files directly — the next build overwrites them."
  - ""
  - "PLACEHOLDER CONVENTION: anything wrapped in [square brackets] is a slot you"
  - "must fill. The build fails loudly if a placeholder survives into an export"
  - "marked `final: true` in build.mjs, so an unfilled resume cannot be sent by"
  - "accident. Run `npm run resume -- --check` to list what is still outstanding."
  - ""
  - "NOTHING HERE IS INVENTED. Content was extracted from src/data/*.js in this"
  - "repository. Where the portfolio had no answer — education, certificates,"
  - "languages, real contact details — the field is an empty slot rather than a"
  - "plausible guess."
meta:
  version: "1.0.0"
  sourceOfTruth: "src/data/*.js"
  defaultVariant: "frontend"
  lastReviewed: "[YYYY-MM-DD — set when you last checked every fact below]"
header:
  name: "[Your Full Name]"
  title: "Frontend Developer"
  tagline: "I design it, then I build it."
  location: "[City, Country]"
  openTo: "Remote · Hybrid · Contract"
  availability: "Available for new projects"
contact:
  email: "[you@yourdomain.com]"
  phone: "[+00 000 0000000]"
  website: "[yourdomain.com]"
  github: "github.com/alisalman81r-ai"
  githubUrl: "https://github.com/alisalman81r-ai"
  linkedin: "[linkedin.com/in/your-handle]"
  dribbble: "[dribbble.com/your-handle — delete if unused]"
_contactNote: "github is the one verified entry — it is the real remote configured on this repository. Everything else is a slot. Set any field to an empty string to drop that line from every output: phone and dribbble are the usual candidates."
summaryVariants:
  _note: "Pick with `npm run resume -- --variant=react`. Each is one paragraph, three sentences at most: what you are, what you work in, what you bring that the next candidate does not. No adjectives about yourself — let the projects carry that."
  frontend: "Frontend developer who came to code through design. I build interfaces in React, Next.js and Tailwind CSS with accessibility and performance treated as part of the build rather than a later pass, and I work in design systems and components rather than one-off screens. Four years of design practice behind the code means I catch the spacing, type and motion problems before they reach review."
  react: "React developer building component-driven interfaces with predictable state, hooks and a design-system foundation. I work across React, Next.js and Tailwind CSS, with enough Node.js, Express and database experience to design a sensible contract with the server instead of working around whatever it returns. I started in graphic design, so interface quality and implementation quality are the same job to me."
  nextjs: "Next.js developer focused on fast, accessible production sites — routing, server rendering, image and font delivery, and Core Web Vitals treated as a budget rather than a hope. I build component-first in React and Tailwind CSS and deploy on Vercel. A background in graphic design means the implementation matches the intent of the design file, including the states the file never shows."
  fullstack: "Full stack developer working from interface to data. React, Next.js and Tailwind CSS on the front, Node.js, Express, MongoDB and Firebase behind them, with Git, GitHub and Vercel around the workflow. Owning both sides means the data model suits the interface rather than the interface working around the data."
  freelance: "Designer and developer who takes web projects end to end — scoping the work, designing the structure, writing the code, and handing over something the client can maintain without calling me back. React, Next.js, Tailwind CSS and Node.js, with four years of graphic and interface design underneath. Clients get one person accountable for how it looks and how it works."
titleVariants:
  frontend: "Frontend Developer"
  react: "React Developer"
