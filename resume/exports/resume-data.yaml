skillsDisplay:
  _note:
    - "The two resumes need different skill lists, and this is where that is declared rather than hard-coded in a template."
    - ""
    - "The ATS resume prints every group above in full, because parser matching is literal: a posting asking for 'GitHub Actions' scores nothing against a resume that only says 'CI'. Exhaustiveness is the point there."
    - ""
    - "The premium resume is read by a person in about forty seconds. Nine categories and sixty terms is not a skill list to them, it is a wall — and 'npm' next to 'React' quietly devalues both. So it shows five merged groups, capped. Nothing is hidden that matters; the full matrix is one click away in the portfolio."
    - ""
    - "`from` names groups in `skills` above. `limit` caps items and is applied after merging."
  premium:
    -
      label: "Frontend"
      from:
        - "Frontend"
      limit: 7
    -
      label: "Backend & Data"
      from:
        - "Backend"
        - "Database"
    -
      label: "Design"
      from:
        - "UI/UX Design"
        - "Graphic Design"
      limit: 8
    -
      label: "Workflow"
      from:
        - "Version Control"
        - "Deployment"
        - "Tools"
      limit: 6
    -
      label: "Learning"
      from:
        - "Currently learning"
atsDisplay:
  _note:
    - "One page is a hard constraint, and the full content is 2.4 pages. These are the cuts that close the gap — declared here so they are decisions you can revisit, not something buried in a template."
    - ""
    - "What survives is chosen by what a recruiter uses in the first pass: job titles, dates, technologies, and outcomes. What goes is what duplicates something else on the page — the role summaries repeat their own bullets, and the achievements repeat the summary."
    - ""
    - "Raise any limit and the resume spills onto a second page. That is a legitimate choice once you have more experience to show; it is not one worth making while a single page still holds everything that matters."
    - ""
    - "`skillGroups` merges categories into fewer LINES without dropping a single keyword — nine labelled lines become six, and every term a parser might match is still present."
  projectLimit: 3
  bulletLimit: 3
  achievementLimit: 1
  softSkillLimit: 3
  includeRoleSummaries: false
  skillGroups:
    -
      label: "Frontend"
      from:
        - "Frontend"
    -
      label: "Backend & Databases"
      from:
        - "Backend"
        - "Database"
    -
      label: "Design"
      from:
        - "UI/UX Design"
        - "Graphic Design"
    -
      label: "Tools & Workflow"
      from:
        - "Version Control"
        - "Deployment"
        - "Tools"
    -
      label: "Currently learning"
      from:
        - "Currently learning"
softSkills:
