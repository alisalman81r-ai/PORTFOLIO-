education:
  _note: "Empty on purpose. src/data/experience.js keeps EDUCATION as an empty array with the comment 'a qualification is a verifiable claim'. Add your real entry below and delete the placeholder; if you have no formal qualification in this field, delete the section entirely — an absent Education section reads far better than an apologetic one."
  entries:
    -
      qualification: "[Degree / Diploma / Programme]"
      institution: "[Institution]"
      location: "[City, Country]"
      period: "[YYYY — YYYY]"
      note: "[Optional: focus, honours, or relevant coursework]"
certificates:
  _note: "Empty on purpose. Nothing in the portfolio records a certification and none will be invented here. Add real ones — issuer, credential ID and verification URL — or delete the section. An unverifiable certificate is a liability in a technical interview."
  entries:
    -
      name: "[Certificate name]"
      issuer: "[Issuing organization]"
      date: "[Month YYYY]"
      credentialId: "[ID, if any]"
      url: "[Verification URL, if any]"
languages:
